<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotton Leaf AI — Precision Agriculture Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = window.location.origin;

    const CONDITIONS_INFO = [
      { name: 'Bacterial Blight', tag: 'Pathogen', desc: 'Angular water-soaked leaf lesions caused by Xanthomonas citri pv. malvacearum' },
      { name: 'Curl Virus', tag: 'Virus', desc: 'Upward/downward leaf curling and enation thickening transmitted by whiteflies' },
      { name: 'Healthy Leaf', tag: 'Normal', desc: 'Normal foliar lamina with uniform chlorophyll and robust vein architecture' },
      { name: 'Herbicide Growth Damage', tag: 'Abiotic', desc: 'Puckering, strap-like elongation, and epinasty caused by herbicide drift' },
      { name: 'Leaf Hopper Jassids', tag: 'Pest', desc: 'Marginal chlorosis and hopper burn caused by Amrasca biguttula nymphs' },
      { name: 'Leaf Redding', tag: 'Physiological', desc: 'Anthocyanin pigmentation caused by nitrogen/magnesium stress or waterlogging' },
      { name: 'Leaf Variegation', tag: 'Genetic/Mosaic', desc: 'Irregular mosaic chimera discoloration across foliar tissues' },
    ];

    const SAMPLES_INFO = [
      { name: 'Bacterial Blight', file: 'BBC00226.jpg', tag: 'Pathogen', desc: 'Angular water-soaked leaf spots' },
      { name: 'Curl Virus', file: 'CV00248.jpg', tag: 'Virus', desc: 'Vein thickening & severe leaf curl' },
      { name: 'Healthy Leaf', file: 'HL00031.jpg', tag: 'Control', desc: 'Normal physiological green foliage' },
      { name: 'Herbicide Growth Damage', file: 'HGD00202.jpg', tag: 'Abiotic', desc: 'Hormonal strap-like epinasty' },
      { name: 'Leaf Hopper Jassids', file: 'LHJ00185.jpg', tag: 'Pest', desc: 'Marginal chlorotic hopperburn' },
      { name: 'Leaf Reddening', file: 'LR00098.jpg', tag: 'Physiological', desc: 'Interveinal anthocyanin bronzing' },
      { name: 'Leaf Variegation', file: 'LV00044.jpg', tag: 'Mosaic', desc: 'Irregular mosaic chimera mottling' },
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('home');
      const [token, setToken] = useState(localStorage.getItem('token'));
      const [user, setUser] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'

      // Auth form
      const [authUsername, setAuthUsername] = useState('');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      // Analyze state
      const [selectedFile, setSelectedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);
      const [analyzeError, setAnalyzeError] = useState(null);
      const [predictionResult, setPredictionResult] = useState(null);
      const [explainTab, setExplainTab] = useState('comparison');

      // Dashboard stats
      const [stats, setStats] = useState(null);

      // History
      const [history, setHistory] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');

      // Admin Telemetry & User Data
      const [adminUsers, setAdminUsers] = useState([]);
      const [adminOverview, setAdminOverview] = useState(null);
      const [adminLogs, setAdminLogs] = useState([]);

      // Auto login check
      useEffect(() => {
        if (token) {
          fetch(`${API_BASE}/api/auth/me`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.ok ? res.json() : Promise.reject())
          .then(data => setUser(data))
          .catch(() => {
            localStorage.removeItem('token');
            setToken(null);
            setUser(null);
          });
        }
      }, [token]);

      // Re-render icons on DOM update
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Load dashboard stats when on dashboard tab
      useEffect(() => {
        if (currentTab === 'dashboard' && token) {
          fetch(`${API_BASE}/api/dashboard/statistics`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.json())
          .then(data => setStats(data))
          .catch(err => console.error(err));
        }
      }, [currentTab, token]);

      // Load admin data when on admin tab and token exists
      useEffect(() => {
        if (currentTab === 'admin' && token) {
          fetch(`${API_BASE}/api/admin/users`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.ok ? res.json() : [])
          .then(data => setAdminUsers(data))
          .catch(err => console.log('Admin users fetch:', err));

          fetch(`${API_BASE}/api/admin/overview`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.ok ? res.json() : null)
          .then(data => setAdminOverview(data))
          .catch(err => console.log('Admin overview fetch:', err));

          fetch(`${API_BASE}/api/admin/audit-logs?limit=20`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
          .then(res => res.ok ? res.json() : [])
          .then(data => setAdminLogs(data))
          .catch(err => console.log('Admin audit logs fetch:', err));
        }
      }, [currentTab, token]);

      // Load history when on history tab
      useEffect(() => {
        if (currentTab === 'history' && token) {
          loadHistory('');
        }
      }, [currentTab, token]);

      const loadHistory = (query) => {
        const url = query ? `${API_BASE}/api/predictions/history?search=${encodeURIComponent(query)}` : `${API_BASE}/api/predictions/history`;
        fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => setHistory(data))
        .catch(err => console.error(err));
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);

        try {
          if (authMode === 'login') {
            const res = await fetch(`${API_BASE}/api/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username_or_email: authUsername, password: authPassword })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Login failed');
            localStorage.setItem('token', data.access_token);
            setToken(data.access_token);
            setUser(data.user);
            setAuthModalOpen(false);
          } else {
            const regRes = await fetch(`${API_BASE}/api/auth/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: authUsername, email: authEmail, password: authPassword, role: 'farmer' })
            });
            const regData = await regRes.json();
            if (!regRes.ok) throw new Error(regData.detail || 'Registration failed');
            // Auto login
            const loginRes = await fetch(`${API_BASE}/api/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username_or_email: authUsername, password: authPassword })
            });
            const loginData = await loginRes.json();
            localStorage.setItem('token', loginData.access_token);
            setToken(loginData.access_token);
            setUser(loginData.user);
            setAuthModalOpen(false);
          }
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('token');
        setToken(null);
        setUser(null);
        setCurrentTab('home');
      };

      const handleFileSelect = (file) => {
        if (!file || !file.type.startsWith('image/')) {
          setAnalyzeError('Please select a valid image file (JPEG, PNG).');
          return;
        }
        setAnalyzeError(null);
        setSelectedFile(file);
        setPreviewUrl(URL.createObjectURL(file));
        setPredictionResult(null);
      };

      const handleSelectSample = async (sample) => {
        try {
          setAnalyzing(true);
          setAnalyzeError(null);
          const res = await fetch(`${API_BASE}/static/samples/${sample.file}`);
          if (!res.ok) throw new Error("Could not load sample leaf file.");
          const blob = await res.blob();
          const file = new File([blob], sample.file, { type: 'image/jpeg' });
          setSelectedFile(file);
          setPreviewUrl(URL.createObjectURL(file));
          setPredictionResult(null);
        } catch (err) {
          setAnalyzeError("Failed to load sample image: " + err.message);
        } finally {
          setAnalyzing(false);
        }
      };

      const handleAnalyze = async () => {
        if (!token) {
          setAuthModalOpen(true);
          return;
        }
        if (!selectedFile) return;

        setAnalyzing(true);
        setAnalyzeError(null);

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
          const res = await fetch(`${API_BASE}/api/predictions/analyze`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Analysis failed');
          setPredictionResult(data);
        } catch (err) {
          setAnalyzeError(err.message);
        } finally {
          setAnalyzing(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navbar */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentTab('home')}>
                <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white shadow-sm font-bold text-xl">
                  🍃
                </div>
                <div>
                  <span className="font-extrabold text-lg text-slate-900 tracking-tight">CottonLeaf<span className="text-brand-600">AI</span></span>
                  <span className="ml-2 text-xs font-semibold px-2 py-0.5 bg-brand-50 text-brand-700 rounded-full border border-brand-200 hidden sm:inline">RTX 3050 CUDA</span>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center space-x-1">
                <button
                  onClick={() => setCurrentTab('home')}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'home' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-50'}`}
                >
                  Home
                </button>
                <button
                  onClick={() => {
                    if (!token) { setAuthModalOpen(true); } else { setCurrentTab('analyze'); }
                  }}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'analyze' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-50'}`}
                >
                  Analyze Leaf
                </button>
                <button
                  onClick={() => {
                    if (!token) { setAuthModalOpen(true); } else { setCurrentTab('dashboard'); }
                  }}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'dashboard' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-50'}`}
                >
                  Dashboard
                </button>
                <button
                  onClick={() => {
                    if (!token) { setAuthModalOpen(true); } else { setCurrentTab('history'); }
                  }}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'history' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-50'}`}
                >
                  Scan History
                </button>
                <button
                  onClick={() => setCurrentTab('admin')}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'admin' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-50'}`}
                >
                  {user && user.role === 'admin' ? '🛡️ Admin Center' : 'Infrastructure'}
                </button>
                <button
                  onClick={() => setCurrentTab('models')}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'models' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-50'}`}
                >
                  AI Models
                </button>
                <button
                  onClick={() => setCurrentTab('about')}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${currentTab === 'about' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:bg-slate-50'}`}
                >
                  Project & Team
                </button>
              </nav>

              {/* User Profile / Auth Button */}
              <div className="flex items-center space-x-3">
                {user ? (
                  <div className="flex items-center space-x-3">
                    <span className="text-sm text-slate-600 hidden sm:inline">
                      {user.role === 'admin' ? (
                        <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-purple-100 text-purple-800 mr-1.5">Admin</span>
                      ) : (
                        <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 mr-1.5">Farmer</span>
                      )}
                      <strong className="text-slate-800">{user.username}</strong>
                    </span>
                    <button
                      onClick={handleLogout}
                      className="px-3 py-1.5 rounded-lg text-sm border border-slate-200 text-slate-600 hover:text-red-600 hover:bg-red-50 transition"
                    >
                      Logout
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => { setAuthMode('login'); setAuthModalOpen(true); }}
                    className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-sm transition"
                  >
                    Sign In
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Content Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
            {/* TAB: HOME */}
            {currentTab === 'home' && (
              <div className="space-y-16">
                <section className="text-center max-w-4xl mx-auto pt-6">
                  <div className="inline-flex items-center space-x-2 px-3.5 py-1 bg-brand-50 border border-brand-200 rounded-full text-brand-700 text-xs font-bold uppercase tracking-wider mb-6">
                    ⚡ EfficientNet-B0 • 97.82% Verified Test Accuracy • NVIDIA RTX 3050 CUDA
                  </div>
                  <h1 className="text-4xl sm:text-5xl lg:text-6xl font-black text-slate-900 tracking-tight leading-tight">
                    AI-Driven Precision Agriculture Platform for <span className="text-brand-600">Cotton Leaf Health</span>
                  </h1>
                  <p className="mt-6 text-lg sm:text-xl text-slate-600 max-w-2xl mx-auto leading-relaxed">
                    Automated cotton foliar disease classification, pixel-level affected area estimation, severity analysis, and official ICAR-CICR agronomic guidance.
                  </p>
                  <div className="mt-8 flex flex-col sm:flex-row items-center justify-center gap-4">
                    <button
                      onClick={() => {
                        if (!token) setAuthModalOpen(true);
                        else setCurrentTab('analyze');
                      }}
                      className="w-full sm:w-auto px-8 py-3.5 rounded-xl text-base font-bold bg-brand-600 hover:bg-brand-700 text-white shadow-lg shadow-brand-500/25 transition"
                    >
                      Start Leaf Diagnosis
                    </button>
                    <button
                      onClick={() => setCurrentTab('admin')}
                      className="w-full sm:w-auto px-8 py-3.5 rounded-xl text-base font-semibold bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-sm transition"
                    >
                      View AI Infrastructure
                    </button>
                  </div>
                </section>

                {/* 7 Target Disease Categories */}
                <section>
                  <div className="text-center mb-8">
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">7 Target Cotton Conditions</h2>
                    <p className="text-sm text-slate-500 mt-1">Differentiating bacterial, viral, sucking pest, and physiological stresses</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {CONDITIONS_INFO.map((c, i) => (
                      <div key={i} className="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition">
                        <div className="flex justify-between items-center mb-3">
                          <span className="text-xs font-bold px-2.5 py-0.5 bg-slate-100 text-slate-700 rounded-full">{c.tag}</span>
                          <span className="text-brand-600 font-bold">Class #{i}</span>
                        </div>
                        <h3 className="text-lg font-bold text-slate-900 mb-1">{c.name}</h3>
                        <p className="text-sm text-slate-600 leading-relaxed">{c.desc}</p>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {/* TAB: ANALYZE */}
            {currentTab === 'analyze' && (
              <div className="max-w-4xl mx-auto space-y-8">
                <div>
                  <h1 className="text-2xl sm:text-3xl font-black text-slate-900">Cotton Leaf Disease Analysis</h1>
                  <p className="text-sm text-slate-500 mt-1">Upload a leaf photograph for instant neural network evaluation</p>
                </div>

                {analyzeError && (
                  <div className="p-4 bg-red-50 border border-red-200 rounded-2xl text-red-700 text-sm">
                    <strong>Error: </strong>{analyzeError}
                  </div>
                )}

                {!predictionResult ? (
                  <div className="bg-white rounded-3xl border border-slate-200 p-8 shadow-sm">
                    <div
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={(e) => {
                        e.preventDefault();
                        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                          handleFileSelect(e.dataTransfer.files[0]);
                        }
                      }}
                      className="border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl p-8 sm:p-12 text-center cursor-pointer transition bg-slate-50/50 hover:bg-slate-50"
                      onClick={() => document.getElementById('fileInput').click()}
                    >
                      <input
                        id="fileInput"
                        type="file"
                        accept="image/*"
                        className="hidden"
                        onChange={(e) => e.target.files && e.target.files[0] && handleFileSelect(e.target.files[0])}
                      />
                      {previewUrl ? (
                        <div className="space-y-4">
                          <img src={previewUrl} alt="Leaf Preview" className="max-h-72 mx-auto rounded-xl object-contain shadow-md" />
                          <p className="text-xs text-slate-500 font-semibold">{selectedFile?.name} (Click or drop to replace)</p>
                        </div>
                      ) : (
                        <div className="space-y-3">
                          <div className="text-5xl">📷</div>
                          <h3 className="text-lg font-bold text-slate-900">Drag and drop your leaf photo here</h3>
                          <p className="text-xs text-slate-500 max-w-sm mx-auto">Supports JPG, PNG, WEBP (Max 15 MB). High-contrast foliage photos produce highest classification confidence.</p>
                        </div>
                      )}
                    </div>

                    {previewUrl && (
                      <div className="mt-6 flex justify-end gap-3">
                        <button
                          onClick={() => { setSelectedFile(null); setPreviewUrl(null); }}
                          className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50"
                        >
                          Clear
                        </button>
                        <button
                          onClick={handleAnalyze}
                          disabled={analyzing}
                          className="px-6 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-md transition disabled:opacity-50"
                        >
                          {analyzing ? 'Evaluating on RTX 3050 CUDA...' : 'Run Neural Diagnostic'}
                        </button>
                      </div>
                    )}

                    {/* Preloaded Sample Gallery for Instant College Demo */}
                    <div className="mt-8 pt-6 border-t border-slate-100">
                      <div className="flex items-center justify-between mb-3">
                        <h4 className="text-sm font-bold text-slate-800 flex items-center">
                          <span className="text-brand-600 mr-2">🌿</span> Click Preloaded Sample for Instant Evaluation
                        </h4>
                        <span className="text-xs text-slate-400">All 7 cotton leaf conditions</span>
                      </div>
                      <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                        {SAMPLES_INFO.map((s, idx) => (
                          <div
                            key={idx}
                            onClick={() => handleSelectSample(s)}
                            className="group cursor-pointer p-2 bg-slate-50 hover:bg-brand-50 border border-slate-200 hover:border-brand-300 rounded-xl transition text-center flex flex-col items-center justify-between shadow-xs hover:shadow-sm"
                          >
                            <img
                              src={`/static/samples/${s.file}`}
                              alt={s.name}
                              className="w-16 h-16 object-cover rounded-lg mb-1.5 shadow-xs group-hover:scale-105 transition"
                            />
                            <div className="text-[11px] font-bold text-slate-800 leading-tight group-hover:text-brand-700">{s.name}</div>
                            <span className="mt-1 text-[9px] px-1.5 py-0.5 bg-white border border-slate-200 text-slate-500 rounded font-semibold">{s.tag}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : (predictionResult.is_cotton_leaf === false || (predictionResult.status && predictionResult.status.startsWith('REJECTED'))) ? (
                  /* GATE REJECTION VIEW */
                  <div className="bg-white rounded-3xl border border-rose-200 p-8 shadow-sm space-y-6">
                    <div className="p-4 bg-rose-50 border border-rose-200 rounded-2xl flex items-start space-x-3.5">
                      <div className="text-2xl flex-shrink-0">🚫</div>
                      <div className="flex-1">
                        <div className="flex flex-wrap items-center gap-2 mb-1">
                          <span className="text-xs font-bold px-2.5 py-0.5 bg-rose-600 text-white rounded-full">
                            {predictionResult.status}
                          </span>
                          <span className="text-xs font-semibold text-rose-700">
                            Verification Gate: Analysis Halted
                          </span>
                        </div>
                        <h3 className="text-xl font-bold text-rose-900">
                          {predictionResult.status === 'REJECTED_QUALITY'
                            ? 'Image Quality Insufficient'
                            : predictionResult.status === 'REJECTED_NON_PLANT'
                            ? 'Not a Cotton Leaf (Non-Plant Detected)'
                            : 'Not a Cotton Leaf (Other Foliage Detected)'}
                        </h3>
                        <p className="text-sm text-rose-800 mt-1">
                          {predictionResult.rejection_reason || predictionResult.user_message || 'The uploaded photograph could not be verified as a valid cotton leaf.'}
                        </p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                      <div className="text-center bg-slate-50 p-6 rounded-2xl border border-slate-200">
                        <span className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-3">
                          Uploaded Image (Rejected Input)
                        </span>
                        <img
                          src={`${API_BASE}${predictionResult.image_url}`}
                          alt="Rejected Uploaded Image"
                          className="max-h-72 mx-auto rounded-xl object-contain border-2 border-rose-300 shadow-sm"
                        />
                      </div>
