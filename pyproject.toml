[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cotton-leaf-ai"
version = "0.1.0"
description = "Cotton leaf disease classification, segmentation, affected-area estimation, and farmer guidance"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
